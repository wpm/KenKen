[package]
name = "kenken"
version = "0.3.0"
edition = "2024"
description = "KenKen puzzle generator and solver"
license = "MIT"
repository = "https://github.com/wpm/KenKen"
keywords = ["kenken", "puzzle", "generator", "solver"]
categories = ["games"]
readme = "README.md"
exclude = [".githooks", ".github"]

[features]
default = ["generate"]
generate = ["dep:rand"]

[dependencies]
rand = { version = "0.10.1", optional = true }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
itertools = "0.14"
rand_chacha = "0.10.0"
serde_json = "1"

[lints.rust]
unused_results = "warn"
